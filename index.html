<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PhotoLink — Photo upload karo, link pao</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       background:linear-gradient(160deg,#0f172a,#1e293b 60%,#0b1120);
       color:#e2e8f0;min-height:100vh;padding:28px 16px}
  .wrap{max-width:720px;margin:0 auto}
  h1{font-size:28px;font-weight:800;text-align:center;
     background:linear-gradient(90deg,#38bdf8,#a78bfa);-webkit-background-clip:text;
     background-clip:text;color:transparent}
  .sub{text-align:center;color:#94a3b8;margin:8px 0 26px;font-size:15px}
  .drop{border:2px dashed #475569;border-radius:18px;padding:44px 20px;text-align:center;
        background:rgba(255,255,255,.03);cursor:pointer;transition:.2s}
  .drop:hover,.drop.over{border-color:#38bdf8;background:rgba(56,189,248,.08)}
  .drop .ic{font-size:44px}
  .drop b{display:block;margin-top:10px;font-size:17px}
  .drop span{color:#94a3b8;font-size:13px}
  #file{display:none}
  .bar{height:6px;background:#1e293b;border-radius:99px;overflow:hidden;margin-top:18px;display:none}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#38bdf8,#a78bfa);transition:.25s}
  .card{background:#111c33;border:1px solid #1e293b;border-radius:14px;padding:12px;
        margin-top:14px;display:flex;gap:12px;align-items:center}
  .card img{width:64px;height:64px;object-fit:cover;border-radius:10px;background:#0b1120}
  .card .info{flex:1;min-width:0}
  .card .lnk{display:block;width:100%;background:#0b1120;border:1px solid #243049;color:#7dd3fc;
             border-radius:8px;padding:7px 9px;font-size:12px;margin-top:6px}
  .card .nm{font-size:13px;color:#cbd5e1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .btn{background:#38bdf8;color:#04283a;border:0;border-radius:8px;padding:9px 14px;
       font-weight:700;cursor:pointer;font-size:13px;white-space:nowrap}
  .btn:hover{background:#7dd3fc}
  .err{background:#3f1d1d;border:1px solid #7f1d1d;color:#fca5a5;padding:10px 12px;
       border-radius:10px;margin-top:14px;font-size:14px}
  h2{font-size:15px;color:#94a3b8;margin:30px 0 10px;font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
  .grid a img{width:100%;height:88px;object-fit:cover;border-radius:10px;border:1px solid #1e293b}
  footer{text-align:center;color:#475569;font-size:12px;margin-top:34px}
</style>
</head>
<body>
<div class="wrap">
  <h1>📷 PhotoLink</h1>
  <p class="sub">Photo upload karo — turant shareable link mil jayega</p>

  <label class="drop" id="drop">
    <div class="ic">⬆️</div>
    <b>Photo yahan daalo ya click karo</b>
    <span>JPG, PNG, GIF, WEBP · max 10 MB · ek saath 10 tak</span>
    <input type="file" id="file" accept="image/*" multiple />
  </label>

  <div class="bar" id="bar"><i></i></div>
  <div id="out"></div>

  <h2>Recent uploads</h2>
  <div class="grid" id="grid"></div>

  <footer>Apna khud ka image-hosting server 🚀</footer>
</div>

<script>
const drop = document.getElementById('drop');
const file = document.getElementById('file');
const out  = document.getElementById('out');
const bar  = document.getElementById('bar');
const grid = document.getElementById('grid');

['dragover','dragenter'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop',ev=>{ if(ev.dataTransfer.files.length) send(ev.dataTransfer.files); });
file.addEventListener('change',()=>{ if(file.files.length) send(file.files); });

function send(files){
  const fd = new FormData();
  for (const f of files) fd.append('photos', f);
  bar.style.display='block'; bar.firstElementChild.style.width='10%';

  const xhr = new XMLHttpRequest();
  xhr.open('POST','/upload');
  xhr.upload.onprogress = e => {
    if(e.lengthComputable) bar.firstElementChild.style.width = (e.loaded/e.total*95)+'%';
  };
  xhr.onload = () => {
    bar.firstElementChild.style.width='100%';
    setTimeout(()=>{bar.style.display='none';bar.firstElementChild.style.width='0'},600);
    let r={}; try{ r=JSON.parse(xhr.responseText) }catch(e){}
    if(!r.ok){ out.insertAdjacentHTML('afterbegin',
      '<div class="err">❌ '+((r&&r.error)||'Upload fail ho gaya')+'</div>'); return; }
    r.files.forEach(show);
    loadList();
  };
  xhr.onerror = () => { bar.style.display='none';
    out.insertAdjacentHTML('afterbegin','<div class="err">❌ Network error</div>'); };
  xhr.send(fd);
}

function show(f){
  const d = document.createElement('div');
  d.className = 'card';
  d.innerHTML =
    '<img src="'+f.url+'" alt="">'+
    '<div class="info"><div class="nm">'+f.name+' · '+(f.size/1024).toFixed(0)+' KB</div>'+
    '<input class="lnk" readonly value="'+f.url+'"></div>'+
    '<button class="btn">Copy</button>';
  const inp = d.querySelector('.lnk'), btn = d.querySelector('.btn');
  btn.onclick = () => {
    inp.select();
    navigator.clipboard?.writeText(f.url).catch(()=>document.execCommand('copy'));
    btn.textContent='Copied ✓'; setTimeout(()=>btn.textContent='Copy',1500);
  };
  out.prepend(d);
}

async function loadList(){
  try{
    const r = await (await fetch('/api/list')).json();
    grid.innerHTML = r.files.map(f=>'<a href="'+f.url+'" target="_blank"><img src="'+f.url+'"></a>').join('');
  }catch(e){}
}
loadList();
</script>
</body>
</html>
